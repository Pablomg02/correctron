<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Correctron PDF{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233451d1'/%3E%3Cpath d='M8 17l5 5 11-12' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/comun/vendor/pico.min.css">
  <link rel="stylesheet" href="/comun/app.css">
  <link rel="stylesheet" href="/static/pdf.css">
  <script src="/comun/vendor/alpine.min.js" defer></script>
</head>
<body>
  <header class="barra">
    <div class="ancho barra-int">
      <a href="/" class="marca" title="Inicio">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8.5 16.5l5 5 10-11"/></svg>
        <span>Correctron PDF</span>
      </a>
      <nav aria-label="breadcrumb">
        <ul>
          <li>{% block migas %}<span aria-current="page">PDFs</span>{% endblock %}</li>
        </ul>
      </nav>
    </div>
  </header>
  <div id="avisos" aria-live="polite"></div>
  <main class="ancho">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
